<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Barbie Salon Booking</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="app-shell">

    <div class="decor decor-1">✂️</div>
    <div class="decor decor-2">💗</div>
    <div class="decor decor-3">✨</div>
    <div class="decor decor-4">💇‍♀️</div>

    <header class="hero">
        <div class="hero-badge">
            Barbie salon mini app
        </div>

        <h1 id="heroTitle">
            Запис до майстра за 1 хвилину
        </h1>

        <p id="heroText">
            Обери, що бажаєш зробити.
        </p>
    </header>

    <main>

        <!-- Головний екран -->

        <section class="card active" id="homeCard">

            <button
                class="primary-btn"
                id="startBooking"
                type="button">

                💇‍♀️ Записатися

            </button>

            <button
                class="secondary-btn"
                id="openMyBookings"
                type="button">

                📅 Мої записи

            </button>

        </section>

        <!-- Скасування -->

        <section class="card hidden" id="cancelCard">

            <div class="step-label">
                Скасування
            </div>

            <h2>Скасувати запис?</h2>

            <div
                id="cancelDetails"
                class="summary visible">
            </div>

            <button
                class="danger-btn"
                id="confirmCancel"
                type="button">

                Так, скасувати запис

            </button>

            <button
                class="secondary-btn"
                id="keepBooking"
                type="button">

                Ні, залишити запис

            </button>

        </section>

        <!-- КРОК 1 -->

        <section class="card step" id="step-service">

            <div class="step-label">
                Крок 1
            </div>

            <h2>Обери послугу</h2>

            <div
                id="services"
                class="grid-list">
            </div>

        </section>

        <!-- КРОК 2 -->

        <section class="card step" id="step-date">

            <div class="step-label">
                Крок 2
            </div>

            <h2>Обери день</h2>

            <div class="calendar-header">

                <button
                    class="icon-btn"
                    id="prevMonth"
                    type="button">

                    ‹

                </button>

                <div
                    id="monthTitle"
                    class="month-title">
                </div>

                <button
                    class="icon-btn"
                    id="nextMonth"
                    type="button">

                    ›

                </button>

            </div>

            <div class="weekdays">
                <span>Пн</span>
                <span>Вт</span>
                <span>Ср</span>
                <span>Чт</span>
                <span>Пт</span>
                <span>Сб</span>
                <span>Нд</span>
            </div>

            <div
                id="calendar"
                class="calendar">
            </div>

        </section>

        <!-- КРОК 3 -->

        <section class="card step" id="step-time">

            <div class="step-label">
                Крок 3
            </div>

            <h2>Обери час</h2>

            <p
                class="hint"
                id="timeHint">

                Спочатку обери послугу і дату.

            </p>

            <div
                id="slots"
                class="slots">
            </div>

        </section>

        <!-- КРОК 4 -->

        <section class="card step" id="step-form">

            <div class="step-label">
                Крок 4
            </div>

            <h2>Залиш дані</h2>

            <form id="bookingForm">

                <label>

                    Ім’я

                    <input
                        id="clientName"
                        name="name"
                        type="text"
                        placeholder="Наприклад, Анна"
                        required>

                </label>

                <label>

                    Телефон

                    <input
                        id="clientPhone"
                        name="phone"
                        type="tel"
                        placeholder="+380..."
                        required>

                </label>

                <label>

                    Коментар

                    <textarea
                        id="clientComment"
                        name="comment"
                        placeholder="Наприклад: хочу укладку на фотосесію"></textarea>

                </label>

                <div
                    class="summary"
                    id="summary">
                </div>

                <button
                    class="primary-btn"
                    id="submitBtn"
                    type="submit">

                    Підтвердити запис 💗

                </button>

            </form>

        </section>

        <!-- Успіх -->

        <section
            class="card success-card hidden"
            id="successCard">

            <div class="success-icon">
                💗
            </div>

            <h2 id="successTitle">
                Твій запис підтверджено
            </h2>

            <div
                id="successDetails"
                class="success-details">
            </div>

            <button
                class="primary-btn"
                id="backToBot"
                type="button">

                Повернутися в бот

            </button>

            <button
                class="secondary-btn"
                id="newBooking"
                type="button">

                Створити ще один запис

            </button>

        </section>

        <section
            class="error-box hidden"
            id="errorBox">
        </section>

    </main>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="app.js"></script>

</body>
</html>
